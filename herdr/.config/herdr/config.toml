onboarding = false

[keys]
prefix = "alt+z"
last_pane = "prefix+t"
previous_agent = "prefix+a"
next_agent = "prefix+d"
goto = "prefix+g"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"

[[keys.command]]
key = "prefix+u"
type = "shell"
description = "open localhost url from this pane in herdr browser"
command = 'u=$("${HERDR_BIN_PATH}" pane read "$HERDR_ACTIVE_PANE_ID" --format text --lines 300 | grep -oE "https?://(localhost|127\.0\.0\.1)(:[0-9]+)?[^[:space:]]*" | tail -1); [ -n "$u" ] && "${HERDR_BIN_PATH}" plugin pane open --plugin official.browser --entrypoint browser --placement split --direction right --focus --env HERDR_BROWSER_INITIAL_URL="$u"'

[ui]
accent = "#FFD300"

show_agent_labels_on_pane_borders = false
[theme]
name = "gruvbox"
auto_switch = false

[ui.toast]
delivery = "terminal"

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "pane", "tab"], ["agent"]]

[experimental]
switch_ascii_input_source_in_prefix = true
kitty_graphics = true
